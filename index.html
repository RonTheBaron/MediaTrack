<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Track — Sign In</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand__mark" aria-hidden="true"></div>
        <h1>Media Track</h1>
        <p>Your private movie &amp; TV watch history.</p>
      </div>

      <div class="auth-panel">
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab is-active" id="tab-login" role="tab" aria-selected="true">Log In</button>
          <button type="button" class="auth-tab" id="tab-signup" role="tab" aria-selected="false">Sign Up</button>
        </div>

        <!-- Login form -->
        <form id="login-form">
          <div class="field">
            <label for="login-email">Email</label>
            <input class="input" type="email" id="login-email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input class="input" type="password" id="login-password" autocomplete="current-password" required />
          </div>
          <p class="form-error" id="login-error"></p>
          <div class="auth-submit-row">
            <button type="submit" class="btn btn-primary btn-block" id="login-submit">
              <span class="btn-label">Log In</span>
            </button>
          </div>
        </form>

        <!-- Signup form -->
        <form id="signup-form" style="display:none;">
          <div class="field">
            <label for="signup-name">Display name (optional)</label>
            <input class="input" type="text" id="signup-name" autocomplete="name" />
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input class="input" type="email" id="signup-email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <input class="input" type="password" id="signup-password" autocomplete="new-password" minlength="6" required />
            <span class="hint">At least 6 characters.</span>
          </div>
          <p class="form-error" id="signup-error"></p>
          <div class="auth-submit-row">
            <button type="submit" class="btn btn-primary btn-block" id="signup-submit">
              <span class="btn-label">Create Account</span>
            </button>
          </div>
        </form>
      </div>

      <p class="auth-footnote">Your library is private — only you can see or edit it.</p>
    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
